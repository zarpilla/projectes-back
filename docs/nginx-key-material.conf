# Production counterpart to src/middlewares/block-key-material.js.
#
# In production nginx serves public/uploads directly and never reaches Node, so
# the Strapi middleware alone does NOT protect the deployed site. Add this to
# the server block, before any `location /uploads` that serves files.
#
# Nothing in the app fetches these over HTTP — the certificate is read from the
# filesystem — so this only removes anonymous download.

location ~* ^/uploads/.*\.(p12|pfx|pem|key|jks|p8|p7b|p7s|asc|gpg|der|crt|cer)$ {
    access_log /var/log/nginx/blocked-key-material.log;
    return 404;
}
