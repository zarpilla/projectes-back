name: Build and Publish Backend Docker image (v5)

# The Strapi v5 backend: one image for every tenant (tenant settings come from
# the environment and the uploads volume). Pairs with esstrapis-front:v5 — the
# frontend's compat layer assumes the v3-compat middleware and the ported
# controllers in this image, and a mismatch 404s every request rather than
# failing loudly.
#
# The v3 backend (zarpilla/projectes) is a different repository, so this needs
# no branch of its own: `main` here IS v5.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-image-${{ github.ref }}
  # Only superseded PR builds are cancelled: on main a run may be deploying, and
  # cutting it off mid-rollout would leave tenants on mixed builds.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The suite is static and unit-level — no database or running server — so
      # it gates the image cheaply. It covers the v3 -> v5 traps that cost the
      # most to find: relations that must be populated, `select` lists that must
      # name only scalars, lifecycle writes that must carry `_internal`, secrets
      # that must not be hashed, and the ETL's column pairing.
      - name: Run tests
        run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Pull requests only build: they never get the credentials or push.
      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          # Same pairing as the frontend: `v5` is what deployments follow, and
          # the sha-pinned tag is what a single tenant rolls back to.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/esstrapis-back:v5
            ${{ secrets.DOCKERHUB_USERNAME }}/esstrapis-back:v5-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploys the image just built to every tenant on the VPS (deploy/docker/deploy.sh:
  # canary first, two at a time, automatic rollback). The SSH key can only run that
  # script (forced command in authorized_keys), and the host key is pinned.
  # Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS.
  # Add required reviewers to the `production` environment to approve each deploy.
  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy v5-${{ github.sha }} to the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
          # Fingerprints only (safe to log), shown as annotations so a wrong secret is obvious.
          echo "::notice title=deploy key::$(ssh-keygen -y -f ~/.ssh/deploy_key | ssh-keygen -lf - || echo 'NOT A VALID PRIVATE KEY')"
          echo "::notice title=known hosts::$(ssh-keygen -lf ~/.ssh/known_hosts | tr '\n' ' ' || echo 'NO VALID HOST KEY')"
          echo "::notice title=target::${VPS_USER:-<empty VPS_USER>}@${VPS_HOST:-<empty VPS_HOST>}"
          set +e
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "$VPS_USER@$VPS_HOST" "v5-${GITHUB_SHA}" 2> >(tee ssh-stderr.log >&2)
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error title=deploy failed (exit $rc)::$(tail -3 ssh-stderr.log | tr '\n' ' ')"
            exit $rc
          fi
