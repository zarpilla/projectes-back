# One service per tenant, all from the same image. Copy to the server as
# docker-compose.yml (e.g. /var/www/esstrapis-back) and add a service per tenant.
#
# network_mode: host keeps everything as with PM2: Strapi listens on
# HOST:PORT from the tenant env (127.0.0.1:<port>, behind the existing nginx
# site) and reaches MySQL on 127.0.0.1.
x-backend: &backend
  image: webcoop/esstrapis-back:${BACK_TAG:-v5}
  restart: unless-stopped
  network_mode: host
  stop_grace_period: 30s
  mem_limit: 1536m
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

services:
  demo:
    <<: *backend
    container_name: esstrapis-back-demo
    env_file: envs/demo.env            # from pm2-env-to-dotenv.js
    volumes:
      - /var/www/demo.projectes/projectes-v5/public/uploads:/opt/app/public/uploads
